version: '3.8'

services:
  frontend:
    image: ercdockercr/dockaudit-dashboard-frontend:latest
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend

  backend:
    image: ercdockercr/dockaudit-dashboard-backend:latest
    volumes:
      # Mount the Docker socket so Dockaudit can analyze the host environment
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist SQLite database
      - dockaudit-db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/dockaudit.db
    restart: always

volumes:
  dockaudit-db:
